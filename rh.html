<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH Completo - Ficha Total</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>body{font-family:Inter,system-ui;background:#f6f6f8;margin:0;padding:20px} .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px} .li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #eee} .pill{padding:2px 10px;border-radius:999px;background:#eee;font-size:11px;font-weight:700} .btn{padding:7px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-weight:600} .btn.primary{background:#C8102E;color:#fff;border-color:#C8102E} .btn.green{background:#16a34a;color:#fff;border:0} input,select,textarea{width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:10px;margin-top:4px} label{font-size:11px;font-weight:800;margin-top:10px;display:block;text-transform:uppercase;color:#6b7280} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} dialog{border:0;border-radius:16px;padding:0;max-width:620px;width:94vw} dialog::backdrop{background:rgba(0,0,0,.45)} .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eee;font-size:14px} .row b{color:#374151} .row span{color:#111;max-width:60%;text-align:right;word-break:break-word} [hidden]{display:none!important}</style></head><body>
<div style="display:flex;justify-content:space-between"><div><h1 style="margin:0">RH / Gestão - Ficha Completa</h1><p style="margin:4px 0 0;color:#6b7280;font-size:12px">ID automático • Chefes veem sua equipa • RH edita</p></div><div><a class="btn" href="PostAngola.html">← Painel</a> <span id="myCode" class="pill"></span></div></div>

<div class="card" id="addCard" hidden><h3 style="margin:0 0 10px">+ Novo Funcionário</h3><div class="grid2"><div><label>Nome completo</label><input id="fName"></div><div><label>Email (login)</label><input id="fEmail" type="email"></div><div><label>Data Nasc.</label><input id="fDob" type="date"></div><div><label>Contacto</label><input id="fPhone"></div><div><label>Morada</label><input id="fAddr"></div><div><label>NIF</label><input id="fNif"></div><div><label>Formação</label><input id="fForm"></div><div><label>Categoria</label><select id="fCat"><option>Efetivo</option><option>Estagiário</option><option>Freelancer</option><option>Colaborador</option></select></div><div><label>Departamento</label><select id="fDept"><option>Redação</option><option>RH</option><option>Comercial</option><option>Técnico</option><option>Direção</option></select></div><div><label>Acesso</label><select id="fAccess"><option value="N1">N1 Editor</option><option value="N2">N2 Editor Chefe</option><option value="B1">B1 RH Técnico</option><option value="B2">B2 Director RH</option><option value="B10">B10 Director Geral</option><option value="M1">M1 Mega Admin</option><option value="M100">M100 Super</option></select></div></div><label>Notas</label><textarea id="fNotes"></textarea><div style="margin-top:10px"><button class="btn primary" id="btnCreate">Criar (pendente se não for C)</button></div></div>

<div class="card"><div style="display:flex;justify-content:space-between"><h3 style="margin:0">Equipa</h3><div><button class="btn primary" id="btnShowAdd" hidden>+ Novo</button> <span id="avgInfo" class="pill"></span> <span id="viewInfo" class="pill"></span></div></div><div id="list">A carregar...</div></div>

<script>
function getPermissions(me){
  const c=me.access_code||'N0'; const dept=me.department;
  const isC=c==='C1', isM100=['M100','M1'].includes(c), isB10=c==='B10', isDirectorRH=dept==='RH'&&(me.rh_role==='director_rh'||c==='B2'), isTecnicoRH=dept==='RH'&&(me.rh_role==='tecnico_rh'||c==='B1'), isDirector=c.startsWith('B'), isChefe=c==='N2'||c.startsWith('B');
  return {
    canAdd:isC||isM100||isDirectorRH||isTecnicoRH,
    canEdit:isC||isM100||isDirectorRH||isTecnicoRH,
    canApprove:isC,
    canViewAll:isC||isM100||isB10||isDirectorRH||isTecnicoRH,
    canViewDept:isDirector||isChefe,
    ownDept:dept, code:c, isC
  };
}
function canSeeProfile(viewer, target, perms){
  if(perms.canViewAll) return true;
  if(perms.canViewDept && target.department===perms.ownDept) return true;
  if(viewer.id===target.id) return true;
  return false;
}
(async()=>{
  const supa=supabase.createClient(PA_CONFIG.SUPABASE_URL, PA_CONFIG.SUPABASE_ANON_KEY);
  const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const {data:{user}}=await supa.auth.getUser(); if(!user){document.body.innerHTML='Faz login';return}
  const {data:me}=await supa.from('profiles').select('*').eq('id',user.id).single(); window._me=me;
  const perms=getPermissions(me); document.getElementById('myCode').textContent=me.full_name+' · '+me.access_code+' · '+me.department;
  if(perms.canAdd){document.getElementById('addCard').hidden=false; document.getElementById('btnShowAdd').hidden=false;}
  document.getElementById('btnShowAdd').onclick=()=>document.getElementById('addCard').hidden=false;
  const {data:perf}=await supa.from('v_performance').select('*');
  const {data:all}=await supa.from('profiles').select('*').order('created_at',{ascending:false});
  window._all=all; window._supa=supa; window._user=user; window._perms=perms;
  const media=perf?.length?perf.reduce((s,x)=>s+(x.news_month||0),0)/perf.length:0;
  document.getElementById('avgInfo').textContent='Média: '+media.toFixed(1);
  const visible=all.filter(p=>canSeeProfile(me,p,perms));
  document.getElementById('viewInfo').textContent=perms.canViewAll?'Vê todos':perms.canViewDept?`Vê dept. ${perms.ownDept}`:'Só você';
  document.getElementById('list').innerHTML=visible.map(p=>{
    const pr=perf?.find(x=>x.id===p.id); const pend=p.approval_status==='pendente'?'<span class=pill style=background:orange;color:#fff>PENDENTE</span>':'';
    return `<div class="li"><div><b>${esc(p.full_name)}</b> ${pend} <span class="pill">${p.access_code}</span> <span class="pill">${esc(p.department||'')} / ${esc(p.rh_role||'')}</span><br><span style="font-size:12px;color:#6b7280">${esc(p.email)} · ID:${p.id.slice(0,8)} · ${pr?pr.news_month+' no mês':''}</span></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn primary" onclick="openFicha('${p.id}')">Ver ficha completa</button>${perms.canApprove&&p.approval_status==='pendente'?`<button class="btn green" onclick="approveEmp('${p.id}')">Aprovar</button>`:''}</div></div>`;
  }).join('')||'<p style="color:#999">Sem acesso a outros perfis</p>';

  window.openFicha=async(id)=>{
    const p=window._all.find(x=>x.id===id); const canEdit=perms.canEdit;
    const d=document.createElement('dialog'); d.innerHTML=`<div style="padding:20px;max-height:85vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Ficha Completa</h3><span class="pill">${esc(p.approval_status||'aprovado')} · ID auto: ${p.id.slice(0,13)}...</span></div>
    <div style="margin-top:12px;background:#f9fafb;padding:12px;border-radius:12px">
      <div class="row"><b>Nome completo</b><span>${esc(p.full_name)}</span></div>
      <div class="row"><b>Email</b><span>${esc(p.email)}</span></div>
      <div class="row"><b>Data Nasc.</b><span>${p.date_of_birth||'<i style=color:#999>sem dados</i>'}</span></div>
      <div class="row"><b>Contacto</b><span>${esc(p.phone||'sem dados')}</span></div>
      <div class="row"><b>Morada</b><span>${esc(p.address||'sem dados')}</span></div>
      <div class="row"><b>NIF</b><span>${esc(p.nif||'sem dados')}</span></div>
      <div class="row"><b>Formação</b><span>${esc(p.formation||'sem dados')}</span></div>
      <div class="row"><b>Categoria</b><span>${esc(p.employee_category||'')}</span></div>
      <div class="row"><b>Departamento</b><span>${esc(p.department||'')}</span></div>
      <div class="row"><b>Função RH</b><span>${esc(p.rh_role||'')}</span></div>
      <div class="row"><b>Acesso</b><span>${esc(p.access_code)} / ${esc(p.role)}</span></div>
      <div class="row"><b>Notas</b><span>${esc(p.notes||'-')}</span></div>
    </div>
    <div id="editBox" ${canEdit?'':'hidden'} style="margin-top:16px;border-top:1px solid #eee;padding-top:12px">
      <h4 style="margin:0 0 8px">✏️ Editar (só RH Técnico, Director RH, M100, C)</h4>
      <div class="grid2"><div><label>Contacto</label><input id="ePhone" value="${esc(p.phone||'')}"></div><div><label>Morada</label><input id="eAddr" value="${esc(p.address||'')}"></div><div><label>Formação</label><input id="eForm" value="${esc(p.formation||'')}"></div><div><label>NIF</label><input id="eNif" value="${esc(p.nif||'')}"></div><div><label>Departamento</label><select id="eDept"><option>${p.department||'Redação'}</option><option>Redação</option><option>RH</option><option>Comercial</option><option>Técnico</option><option>Direção</option></select></div><div><label>Função RH</label><select id="eRh"><option value="${p.rh_role||'funcionario'}">${p.rh_role||'funcionario'}</option><option value="funcionario">funcionario</option><option value="tecnico_rh">tecnico_rh</option><option value="director_rh">director_rh</option><option value="ceo">ceo</option></select></div></div><label>Notas</label><textarea id="eNotes">${esc(p.notes||'')}</textarea>
      <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="this.closest('dialog').close()">Fechar</button><button class="btn primary" id="btnSave">Guardar alterações</button></div>
    </div>
    <div ${canEdit?'hidden':''} style="margin-top:12px;text-align:right"><button class="btn" onclick="this.closest('dialog').close()">Fechar</button> <span style="font-size:12px;color:#999">Sem permissão para editar</span></div>
    </div>`;
    document.body.appendChild(d); d.showModal();
    d.querySelector('#btnSave')?.addEventListener('click',async()=>{
      const {error}=await window._supa.from('profiles').update({phone:d.querySelector('#ePhone').value, address:d.querySelector('#eAddr').value, formation:d.querySelector('#eForm').value, nif:d.querySelector('#eNif').value, department:d.querySelector('#eDept').value, rh_role:d.querySelector('#eRh').value, notes:d.querySelector('#eNotes').value}).eq('id',id);
      if(error) alert(error.message); else {d.close(); location.reload();}
    });
    d.addEventListener('close',()=>d.remove());
  };
  window.approveEmp=async(id)=>{const {error}=await supa.from('profiles').update({approval_status:'aprovado',approved_by:user.id}).eq('id',id); if(error)alert(error.message);else location.reload();};
  document.getElementById('btnCreate').onclick=async()=>{
    const name=document.getElementById('fName').value.trim(), email=document.getElementById('fEmail').value.trim(), access=document.getElementById('fAccess').value;
    if(!name||!email){alert('Nome e email');return}
    const btn=document.getElementById('btnCreate'); btn.disabled=true;
    try{const tempPass='PostAngola@'+Math.floor(1000+Math.random()*9000); const {data:sign,error:se}=await supa.auth.signUp({email,password:tempPass,options:{data:{full_name:name}}}); if(se)throw se; const nid=sign.user?.id; const role=access.startsWith('B')?'director':access.startsWith('M')||access==='C1'?'admin':'editor'; const status=perms.isC?'aprovado':'pendente'; const rh=access==='B1'?'tecnico_rh':access==='B2'?'director_rh':'funcionario'; const payload={id:nid,full_name:name,email,access_code:access,role,phone:document.getElementById('fPhone').value||null,address:document.getElementById('fAddr').value||null,nif:document.getElementById('fNif').value||null,formation:document.getElementById('fForm').value||null,date_of_birth:document.getElementById('fDob').value||null,employee_category:document.getElementById('fCat').value,department:document.getElementById('fDept').value,rh_role:rh,approval_status:status,requested_by:user.id,notes:document.getElementById('fNotes').value||null}; const {error}=await supa.from('profiles').upsert(payload); if(error)throw error; alert(`Criado ID:${nid.slice(0,8)} Status:${status} Email:${email} Pass:${tempPass}`); location.reload();}catch(e){alert(e.message); btn.disabled=false;}
  };
})();
</script></body>
</html>
