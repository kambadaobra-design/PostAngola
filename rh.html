<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RH PostAngola</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>body{font-family:Inter,Arial;background:#f6f6f8;padding:20px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px}.li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.pill{padding:2px 10px;border-radius:999px;background:#eee;font-size:12px;font-weight:600}.btn{padding:6px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;cursor:pointer}.btn.primary{background:#C8102E;color:#fff;border-color:#C8102E}</style></head><body>
<div style="display:flex;justify-content:space-between"><h2>RH - Gestão</h2><a class="btn" href="PostAngola.html">← Painel</a></div>
<div class="card"><h3>Equipa</h3><div id="list"></div></div>
<script>
(async()=>{
  const supa=supabase.createClient(PA_CONFIG.SUPABASE_URL,PA_CONFIG.SUPABASE_ANON_KEY);
  const {data:{user}}=await supa.auth.getUser(); if(!user){document.body.innerHTML='Faz login';return}
  const {data:me}=await supa.from('profiles').select('*').eq('id',user.id).single();
  const {data:perf}=await supa.from('v_performance').select('*');
  const canViewAll=['B1','B2','B10','M1','M100','C1'].includes(me.access_code);
  const canPromote=(actor,target,newCode)=>{
    if(actor==='C1') return true;
    if(actor==='M100') return newCode!=='C1' || target==='C1';
    if(actor==='M1') return ['N0','N1','N2','B1','B2','B10','M1'].includes(newCode);
    return false;
  };
  document.getElementById('list').innerHTML=perf.map(p=>{
    if(!canViewAll && p.id!==me.id) return '';
    const canEdit=canPromote(me.access_code,p.access_code,p.access_code);
    return `<div class=li><div><b>${p.full_name}</b> - ${p.access_code} - ${p.news_month||0} no mês - ${p.news_week||0} semana ${ (p.news_month||0) >= (perf.reduce((s,x)=>s+(x.news_month||0),0)/perf.length) ? '▲ acima média' : '▼ abaixo média'}</div><div>${canEdit?`<select id="sel-${p.id}"><option>${p.access_code}</option><option>N0</option><option>N1</option><option>N2</option><option>B1</option><option>B2</option><option>B10</option><option>M1</option><option>M100</option><option>C1</option></select><button class="btn primary" onclick="save('${p.id}')">Salvar</button>`:`<span class=pill>só leitura</span>`}</div></div>`;
  }).join('');
  window.save=async(id)=>{
    const code=document.getElementById('sel-'+id).value;
    if(!canPromote(me.access_code,(perf.find(x=>x.id===id)||{}).access_code,code)){alert('Sem permissão para dar este acesso');return}
    const role=code==='N1'?'editor':code==='N2'?'editor_chefe':code.startsWith('B')?'director':code.startsWith('M')?'admin':code.startsWith('C')?'ceo':'reader';
    const {error}=await supa.from('profiles').update({access_code:code,role}).eq('id',id);
    if(error){alert(error.message);return}
    await supa.from('audit_logs').insert({actor_id:user.id,action:'promote',target_id:id,details:{new_code:code,by:me.full_name}});
    alert('Promovido para '+code); location.reload();
  };
})();
</script></body></html>
