<title>RH e Equipa | PostAngola</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4F1; --surface:#FFFFFF; --surface-2:#F0EDE8; --text:#16120F; --muted:#6B645C;
  --border:#E3DED6; --primary:#C8102E; --primary-ink:#FFFFFF; --gold:#E5A800; --ok:#1B7F4B; --ok-bg:#E3F4EA;
  --warn:#8A5A00; --warn-bg:#FFF3D6; --shadow:0 1px 2px rgba(22,18,15,.06),0 8px 24px rgba(22,18,15,.06);
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0D0C; --surface:#1A1715; --surface-2:#252019; --text:#F4EFE9; --muted:#A39B90;
    --border:#332D27; --primary:#E5304D; --ok:#5FD08F; --ok-bg:#12281C; --warn:#F2C45C; --warn-bg:#2E2410;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --logo-text:#F4EFE9; --logo-body:#3A342E; --logo-red:#E5304D;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0D0C; --surface:#1A1715; --surface-2:#252019; --text:#F4EFE9; --muted:#A39B90;
  --border:#332D27; --primary:#E5304D; --ok:#5FD08F; --ok-bg:#12281C; --warn:#F2C45C; --warn-bg:#2E2410;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --logo-text:#F4EFE9; --logo-body:#3A342E; --logo-red:#E5304D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.top-actions{display:flex;align-items:center;gap:8px;min-width:0}
.link-chip{display:flex;align-items:center;gap:8px;height:38px;max-width:280px;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.link-chip.empty .dot{background:var(--gold)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center}

/* Layout */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 64px)}
.rail{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:0;background:transparent;cursor:pointer;font-weight:600;color:var(--muted);text-align:left;width:100%}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav[aria-current="page"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
main{padding:24px 28px 56px;max-width:1240px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:30px;letter-spacing:-.025em;line-height:1.15;font-weight:800}
.sub{color:var(--muted);margin-top:4px;max-width:60ch}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}

/* Components */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--primary)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.danger{color:var(--primary)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field{margin-bottom:14px}
input[type=text],input[type=url],textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:15px}
input[type=text]:focus,input[type=url]:focus,textarea:focus,select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
textarea{resize:vertical;min-height:96px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:8px 13px;border-radius:9px;border:1px solid var(--border);background:var(--bg);font-weight:600;font-size:13.5px}
.seg input:checked + span{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.notice{padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;font-size:14px}

/* Dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat small{color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li .t{font-weight:600;min-width:0}
.li .t span{display:block;font-weight:400;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .acts{display:flex;gap:6px;flex:none}
.start{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px;border-radius:18px;background:linear-gradient(135deg,#C8102E,#7A0A1C);color:#fff;margin-bottom:16px;flex-wrap:wrap}
.start h2{font-size:24px;letter-spacing:-.02em;max-width:22ch;line-height:1.2}
.start p{opacity:.88;margin-top:6px;max-width:48ch}
.start .btn{background:#fff;color:#7A0A1C;border-color:#fff}

/* Composer */
.studio{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.preview-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;background:var(--surface-2);border-radius:14px}
.stage{--ar:1;width:min(100%,calc(66vh * var(--ar)));aspect-ratio:var(--ar);border-radius:10px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.28);background:#222}
.stage canvas{width:100%;height:100%;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);font-weight:600;font-size:13px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.cap-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.counter{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.counter.over{color:var(--primary);font-weight:700}
.net-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.net{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:left;font-weight:600;font-size:14px}
.net:hover{border-color:var(--text)}
.net i{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:13px;flex:none}
.net small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;line-height:1.2}
.group-title{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px}
.group-title:first-child{margin-top:0}

/* News */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.news{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.news h3{font-size:17px;line-height:1.3;letter-spacing:-.01em}
.news p{color:var(--muted);font-size:14px;flex:1}
.cat{display:inline-block;align-self:flex-start;padding:3px 10px;border-radius:999px;background:var(--primary);color:#fff;font-size:12px;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

/* Settings table */
.integ{display:flex;flex-direction:column}
.integ .li .t span{white-space:normal}

/* Dialog */
dialog{margin:auto;border:1px solid var(--border);border-radius:18px;padding:0;background:var(--surface);color:var(--text);width:min(480px,calc(100% - 28px));box-shadow:0 24px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,8,6,.55)}
.dlg{padding:22px}
.dlg h2{font-size:20px;margin-bottom:4px}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--border)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.step.done .n{background:var(--ok);color:#fff}
.step .b{flex:1;min-width:0}
.step .b p{color:var(--muted);font-size:13px;margin:2px 0 8px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){
  .studio{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:30;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--border);gap:0}
  .nav{flex-direction:column;gap:3px;padding:7px 4px;font-size:11px;text-align:center;justify-content:center;width:auto;flex:1}
  main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  h1{font-size:25px}
  .row2{grid-template-columns:1fr}
  .link-chip{max-width:150px}
  .brand span.name{display:none}
  #toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .stage{width:min(100%,calc(60vh * var(--ar)))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.lg-text{fill:var(--logo-text,#121212)}.lg-body{fill:var(--logo-body,#121212)}.lg-red{fill:var(--logo-red,#C8102E)}.brand{color:inherit;text-decoration:none}
.brand svg{height:40px;width:auto;display:block}
a.btn{color:inherit;text-decoration:none}
#userName:empty{display:none}
.logo-sym{display:none}
@media (max-width:760px){.logo-full{display:none}.logo-sym{display:block}.brand svg{height:36px}.top-actions a.btn{display:none}.link-chip{max-width:130px}}
.adrow{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--border)}
.adrow:first-child{border-top:0;padding-top:0}
.adth{width:100%;height:auto;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);display:block}
.adrow-b{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.adrow-b .t{min-width:0}
.adrow-b .t span{display:block;color:var(--muted);font-size:12.5px;word-break:break-all}
.adrow-b .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:760px){.rail{overflow-x:auto;justify-content:flex-start}.nav{flex:0 0 auto;min-width:76px}}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
.gate-box{max-width:420px}
.gate-box h2{font-size:22px;margin-bottom:8px}
.gate-box p{color:var(--muted);margin-bottom:16px}
.li .acts{flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){#userName{display:none}}

main.rh{margin:0 auto;padding:24px 28px 56px;max-width:1100px;width:100%}
@media (max-width:760px){main.rh{padding:18px 16px 56px}}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="staff.js"></script>
</head>

<main class="rh">
  <div class="page-head"><div><h1>RH e Equipa</h1><p class="sub">Fichas, níveis de acesso, convites e auditoria. As regras são impostas pela base de dados: cada pessoa só vê o que o seu nível permite.</p></div></div>
  <div id="staffRoot"></div>

<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
try{const t=JSON.parse(localStorage.getItem('pa:uiTheme'));if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3600)}
function gate(h){const g=$('#gate');g.hidden=false;g.querySelector('.gate-box').innerHTML=h}
const CFG=window.PA_CONFIG||{};
const sb=(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
$('#btnSignOut').addEventListener('click',async()=>{if(sb)await sb.auth.signOut();location.href='index.html'});
async function init(){
  const back='<a class="btn primary" href="PostAngola.html">Voltar ao painel</a>';
  if(!sb){gate('<h2>Falta configurar o Supabase</h2><p>Abra o ficheiro config.js.</p>');return}
  const r=await PAStaff.loadMe(sb);
  if(r.error==='login'){location.replace('index.html?login=1');return}
  if(r.error==='migration'){gate('<h2>Base de dados por atualizar</h2><p>Falta correr o ficheiro supabase_rh.sql no SQL Editor do Supabase.</p>'+back);return}
  if(r.error){gate('<h2>Perfil não encontrado</h2><p>Tente sair e entrar de novo.</p>'+back);return}
  const m=r.me;
  if(!m.active){gate('<h2>Conta inativa ou por aprovar</h2><p>Fale com o RH ou com o proprietário.</p>'+back);return}
  if(m.level<10){gate('<h2>Acesso reservado</h2><p>O seu nível ('+PAStaff.esc(m.access_code)+') não permite aceder a esta página.</p>'+back);return}
  $('#userName').textContent=m.name+' · '+m.access_code+' · '+(PAStaff.LABELS[m.access_code]||'');
  $('#gate').hidden=true;
  PAStaff.mount($('#staffRoot'),{sb:sb,me:m,mode:'full',toast:toast});
}
init();
})();
</script>
