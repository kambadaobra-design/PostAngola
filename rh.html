<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RH - Gestão Interna PostAngola</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>:root{--red:#C8102E;--bg:#f6f6f8;--card:#fff;--text:#121212;--muted:#6b7280;--ok:#16a34a;--warn:#d97706}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text);padding:20px}h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}.pill{display:inline-flex;padding:2px 10px;border-radius:999px;background:#eee;font-size:12px;font-weight:600}.pill.warn{background:#fef3c7;color:var(--warn)}.pill.ok{background:#dcfce7;color:var(--ok)}.pill.mega{background:#121212;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse}th{font-size:12px;text-align:left;color:var(--muted);padding:8px}td{padding:10px 8px;border-top:1px solid #eee;font-size:14px}.li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0}.li .t{font-weight:600}.li .t span{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}.btn{padding:6px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-weight:600}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}select{padding:6px;border-radius:8px;border:1px solid #e5e7eb}a{color:var(--red);text-decoration:none;font-weight:600}.empty{color:var(--muted);font-size:13px;padding:12px 0}</style></head><body><div class="page-head"><div><h1>RH - PostAngola</h1><p class="sub">Gestão interna: performance, acessos N/B/M/C e auditoria.</p></div><div><a href="PostAngola.html" class="btn">← Voltar ao Painel</a> <span id="myCode" class="pill mega" style="margin-left:8px">...</span></div></div><div class="grid2"><div class="card"><div style="display:flex;justify-content:space-between"><h3 style="margin:0">Indicadores</h3><span id="avgInfo" class="pill"></span></div><div id="stats" style="margin-top:12px"></div></div><div class="card"><h3 style="margin:0 0 8px">Auditoria</h3><div id="audit"><div class="empty">A carregar...</div></div></div></div><div class="card"><h3 style="margin:0 0 12px">Equipa & Performance</h3><table><thead><tr><th>Nome</th><th>Acesso</th><th>Semana</th><th>Mês</th><th>Publicadas</th><th>Pendentes</th><th>Ação</th></tr></thead><tbody id="tbody"></tbody></table></div><script>(async()=>{const cfg=window.PA_CONFIG||{SUPABASE_URL:'https://dniuybnmwlsvgxbvtrkn.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_GsZRs1JrD0y-wYav9wjl2A_Ju1loLJp'};const supa=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const {data:{user}}=await supa.auth.getUser();if(!user){document.body.innerHTML='<div class=card><h2>Precisas fazer login no PostAngola.html primeiro</h2><a class=btn href=PostAngola.html>Ir para Painel</a></div>';return;}const {data:me}=await supa.from('profiles').select('*').eq('id',user.id).single();document.getElementById('myCode').textContent=me.access_code+' · '+me.role;const myLevel=(()=>{const c=me.access_code||'N0';if(c==='M100')return 100;if(c.startsWith('C'))return 200;if(c.startsWith('M'))return 90;if(c.startsWith('B10'))return 80;if(c.startsWith('B2'))return 70;if(c.startsWith('B'))return 60;if(c==='N2')return 20;if(c==='N1')return 10;return 0;})();const {data:perf}=await supa.from('v_performance').select('*');const {data:audit}=await supa.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(25);const media=perf&&perf.length?perf.reduce((s,x)=>s+(x.news_month||0),0)/perf.length:0;document.getElementById('avgInfo').textContent='Média mensal: '+media.toFixed(1)+' notícias';document.getElementById('stats').innerHTML=perf.map(p=>{const above=(p.news_month||0)>=media;return `<div class=li><div class=t>${esc(p.full_name)}<span>${p.news_month} no mês · ${p.news_week} na semana · ${above?'<b style=color:#16a34a>▲ acima</b>':'<b style=color:#d97706>▼ abaixo</b>'} média</span></div><span class="pill ${p.pending_approval>0?'warn':'ok'}">${p.pending_approval||0} pendentes</span></div>`}).join('');document.getElementById('tbody').innerHTML=perf.map(p=>{const canEdit=me.access_code==='M100'||(myLevel>=90&&(p.access_code||'').startsWith('N'))||(myLevel>=200);const showFull=myLevel>=20||p.id===me.id;if(!showFull&&p.id!==me.id)return '';return `<tr><td><b>${esc(p.full_name)}</b><br><span style="color:#6b7280;font-size:12px">${esc(p.department||'Redação')}</span></td><td><span class="pill ${p.access_code==='M100'?'mega':''}">${esc(p.access_code)}</span><br><span style="font-size:11px;color:#6b7280">${esc(p.role)}</span></td><td>${p.news_week||0}</td><td>${p.news_month||0}</td><td>${p.total_published||0}</td><td>${p.pending_approval||0}</td><td>${canEdit?`<select id="sel-${p.id}"><option>${p.access_code}</option><option>N0</option><option>N1</option><option>N2</option><option>B1</option><option>B2</option><option>B10</option><option>M1</option><option>M100</option><option>C1</option></select> <button class="btn primary" onclick="saveAccess('${p.id}')">OK</button>`:`<span style="font-size:12px;color:#6b7280">só leitura</span>`}</td></tr>`}).join('');document.getElementById('audit').innerHTML=(audit||[]).map(a=>`<div class=li><div class=t>${esc(a.action)}<span>${new Date(a.created_at).toLocaleString('pt-AO')} · ${esc(JSON.stringify(a.details||{}))}</span></div></div>`).join('')||'<div class=empty>Sem logs</div>';window.saveAccess=async(id)=>{const sel=document.getElementById('sel-'+id);const code=sel.value;const role=code==='N1'?'editor':code==='N2'?'editor_chefe':code.startsWith('B')?'director':code.startsWith('M')?'admin':code.startsWith('C')?'ceo':'reader';const {error}=await supa.from('profiles').update({access_code:code,role}).eq('id',id);if(error){alert('Erro: '+error.message);return;}await supa.from('audit_logs').insert({actor_id:user.id,action:'promote',target_id:id,details:{new_code:code,by:me.full_name}});alert('Atualizado para '+code);location.reload();};})();</script></body></html>
